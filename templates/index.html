<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Flight Status Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0d12;
    --panel: #10151d;
    --panel-border: #1e2733;
    --accent: #39ff88;
    --accent-dim: rgba(57, 255, 136, 0.14);
    --amber: #ffb000;
    --text-primary: #e6edf3;
    --text-muted: #6b7785;
    --text-label: #8b95a5;
    --danger: #ff5c5c;
    --sans: 'Space Grotesk', sans-serif;
    --mono: 'JetBrains Mono', monospace;
  }

  * { box-sizing: border-box; }

  body {
    background: var(--bg);
    color: var(--text-primary);
    font-family: var(--sans);
    margin: 0;
    min-height: 100vh;
    padding: 48px 20px;
    position: relative;
    overflow-x: hidden;
  }

  /* subtle ambient scanline sweep */
  @media (prefers-reduced-motion: no-preference) {
    body::before {
      content: "";
      position: fixed;
      top: 0; left: 0; right: 0;
      height: 2px;
      background: linear-gradient(90deg, transparent, var(--accent-dim), transparent);
      animation: sweep 6s linear infinite;
      opacity: 0.5;
      pointer-events: none;
    }
    @keyframes sweep {
      0% { transform: translateY(0); }
      100% { transform: translateY(100vh); }
    }
  }

  .wrap { max-width: 560px; margin: 0 auto; position: relative; z-index: 1; }

  .eyebrow {
    font-family: var(--mono);
    font-size: 12px;
    letter-spacing: 0.15em;
    color: var(--accent);
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 10px;
  }

  .dot {
    width: 7px; height: 7px;
    border-radius: 50%;
    background: var(--accent);
    box-shadow: 0 0 8px var(--accent);
  }
  @media (prefers-reduced-motion: no-preference) {
    .dot.pulse { animation: pulse 1.8s ease-in-out infinite; }
    @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.35; } }
  }

  h1 {
    font-size: 28px;
    font-weight: 700;
    margin: 0 0 32px;
    letter-spacing: -0.01em;
  }

  /* bracket-cornered console frame — the signature element */
  .bracketed {
    position: relative;
    padding: 20px;
  }
  .bracketed::before,
  .bracketed::after,
  .bracketed .br-tr,
  .bracketed .br-bl {
    content: "";
    position: absolute;
    width: 14px; height: 14px;
    border: 2px solid var(--accent);
  }
  .bracketed::before { top: -1px; left: -1px; border-right: none; border-bottom: none; }
  .bracketed::after { bottom: -1px; right: -1px; border-left: none; border-top: none; }
  .bracketed .br-tr { top: -1px; right: -1px; border-left: none; border-bottom: none; }
  .bracketed .br-bl { bottom: -1px; left: -1px; border-right: none; border-top: none; }

  .search-panel {
    background: var(--panel);
    border: 1px solid var(--panel-border);
    margin-bottom: 24px;
  }

  .search-row { display: flex; gap: 10px; }

  input {
    flex: 1;
    background: var(--bg);
    border: 1px solid var(--panel-border);
    color: var(--text-primary);
    font-family: var(--mono);
    font-size: 15px;
    letter-spacing: 0.05em;
    padding: 12px 14px;
    border-radius: 4px;
    text-transform: uppercase;
  }
  input::placeholder { color: var(--text-muted); text-transform: none; }
  input:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }

  button {
    background: var(--accent);
    color: #04170c;
    border: none;
    font-family: var(--sans);
    font-weight: 700;
    font-size: 14px;
    letter-spacing: 0.03em;
    padding: 12px 20px;
    border-radius: 4px;
    cursor: pointer;
  }
  button:hover { background: #5dffa3; }
  button:focus-visible { outline: 2px solid var(--text-primary); outline-offset: 2px; }

  #result { min-height: 20px; }

  .status-msg {
    font-family: var(--mono);
    font-size: 13px;
    color: var(--text-muted);
    padding: 4px 2px;
  }
  .status-msg.error { color: var(--danger); }

  .data-panel {
    background: var(--panel);
    border: 1px solid var(--panel-border);
  }

  .panel-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding-bottom: 16px;
    margin-bottom: 4px;
    border-bottom: 1px solid var(--panel-border);
  }

  .callsign-lg {
    font-family: var(--mono);
    font-size: 22px;
    font-weight: 700;
    letter-spacing: 0.04em;
  }

  .status-pill {
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 0.08em;
    padding: 4px 10px;
    border-radius: 20px;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .status-pill.air { background: var(--accent-dim); color: var(--accent); }
  .status-pill.ground { background: rgba(255,176,0,0.14); color: var(--amber); }

  .grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 1px;
    background: var(--panel-border);
    margin-top: 16px;
  }

  .stat {
    background: var(--panel);
    padding: 14px 4px;
  }

  .stat-label {
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: 0.1em;
    color: var(--text-label);
    text-transform: uppercase;
    margin-bottom: 6px;
  }

  .stat-value {
    font-family: var(--mono);
    font-size: 16px;
    font-weight: 500;
  }

  @media (max-width: 480px) {
    .grid { grid-template-columns: 1fr; }
    h1 { font-size: 22px; }
  }
</style>
</head>
<body>
  <div class="wrap">
    <div class="eyebrow"><span class="dot pulse"></span>LIVE ADS-B FEED</div>
    <h1>Flight Status Tracker</h1>

    <div class="search-panel bracketed">
      <span class="br-tr"></span><span class="br-bl"></span>
      <div class="search-row">
        <input id="callsign" placeholder="ENTER CALLSIGN — E.G. ANZ1" onkeydown="if(event.key==='Enter') search()" autocomplete="off" />
        <button onclick="search()">Track</button>
      </div>
    </div>

    <div id="result"></div>
  </div>

<script>
  async function search() {
    const callsign = document.getElementById("callsign").value.trim();
    const resultEl = document.getElementById("result");
    if (!callsign) return;

    resultEl.innerHTML = '<p class="status-msg">Querying live feed…</p>';

    let data;
    try {
      const res = await fetch(`/flight/${callsign}`);
      data = await res.json();
    } catch (e) {
      resultEl.innerHTML = '<p class="status-msg error">Connection to tracking service failed. Check the server is running and try again.</p>';
      return;
    }

    if (data.error) {
      resultEl.innerHTML = `<p class="status-msg error">No aircraft found for "${callsign.toUpperCase()}" — it may not currently be airborne. Try another callsign.</p>`;
      return;
    }

    const airborne = !data.on_ground;
    resultEl.innerHTML = `
      <div class="data-panel bracketed">
        <span class="br-tr"></span><span class="br-bl"></span>
        <div class="panel-header">
          <span class="callsign-lg">${data.callsign}</span>
          <span class="status-pill ${airborne ? 'air' : 'ground'}">
            <span class="dot ${airborne ? 'pulse' : ''}" style="background:${airborne ? 'var(--accent)' : 'var(--amber)'}; box-shadow:0 0 6px ${airborne ? 'var(--accent)' : 'var(--amber)'};"></span>
            ${airborne ? 'AIRBORNE' : 'ON GROUND'}
          </span>
        </div>
        <div class="grid">
          <div class="stat"><div class="stat-label">Origin Country</div><div class="stat-value">${data.origin_country}</div></div>
          <div class="stat"><div class="stat-label">Altitude</div><div class="stat-value">${Number(data.altitude_m).toFixed(0)} m</div></div>
          <div class="stat"><div class="stat-label">Latitude</div><div class="stat-value">${Number(data.latitude).toFixed(4)}</div></div>
          <div class="stat"><div class="stat-label">Longitude</div><div class="stat-value">${Number(data.longitude).toFixed(4)}</div></div>
          <div class="stat"><div class="stat-label">Ground Speed</div><div class="stat-value">${Number(data.velocity_mps).toFixed(1)} m/s</div></div>
          <div class="stat"><div class="stat-label">Status</div><div class="stat-value">${airborne ? 'In Flight' : 'Grounded'}</div></div>
        </div>
      </div>
    `;
  }
</script>
</body>
</html>
